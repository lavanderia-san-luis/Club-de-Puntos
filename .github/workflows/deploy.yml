name: Deploy LSL Admin

on:
  push:
    branches:
      - main # O la rama que uses (master/main)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Este paso busca las marcas de posición en tu archivo JS y las cambia por tus secretos de GitHub
# Este paso busca las marcas de posición en tu HTML y las cambia por tus secretos
      # Este paso busca las marcas de posición en tu HTML y las cambia por tus secretos
      - name: Inyectar Secretos en el código
        run: |
          sed -i -E "s|PROCESS_ENV_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g" bofv97efvoq357bg.html
          sed -i -E "s|PROCESS_ENV_SUPABASE_KEY|${{ secrets.SUPABASE_KEY }}|g" bofv97efvoq357bg.html
          sed -i -E "s|PROCESS_ENV_ADMIN_CODE|${{ secrets.ADMIN_CODE }}|g" bofv97efvoq357bg.html

      # Paso de ejemplo para desplegar en GitHub Pages (ajústalo según tu hosting)
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # La carpeta donde está tu proyecto
          branch: gh-pages # Rama de despliegue
